# Amlogic S905Y2 512MB/1GB/2GB/4GB RAM eMMC USB3 WiFi BT
BOARD_NAME="F2R Y1000"
BOARDFAMILY="meson-g12a"
BOARD_MAINTAINER="Joao Carreira"
BOOTCONFIG="f2r-y1000_config"
CPUMIN=6660000
CPUMAX=1800000
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
MODULES_BLACKLIST="simpledrm" # SimpleDRM conflicts with Panfrost
FULL_DESKTOP="yes"
FORCE_BOOTSCRIPT_UPDATE="yes"
BOOT_LOGO="desktop"
ASOUND_STATE="asound.state.radxa-zero"
# BOOT_FDT_FILE="amlogic/meson-g12a-f2r-y1000.dtb"

KERNEL_GIT=shallow

# Newer u-boot for the Zero
BOOTBRANCH_BOARD="tag:v2023.07.02"
BOOTPATCHDIR="v2023.07.02"
BOOTENV_FILE="f2r-y1000.txt"
PLYMOUTH="no"
